name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  # Split from a single `bun run check` so a failure names the stage that broke
  # instead of just "check failed", and so lint and typecheck feedback does not
  # wait behind a full production build.
  static-analysis:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # GHSA-mh99-v99m-4gvg (brace-expansion DoS) is reviewed and excluded, not
      # forgotten. It reaches the tree only through eslint's own glob matcher,
      # so it is dev-time only and never sees user input. The only fixed
      # release, brace-expansion 5, is an API break that the minimatch 3.x
      # depending on it cannot consume — overriding it makes `bun run lint`
      # throw. Drop this flag once eslint ships a minimatch that can take it.
      - name: Audit dependencies for known vulnerabilities
        run: bun audit --audit-level=high --ignore GHSA-mh99-v99m-4gvg

  # The lockfile is the only thing standing between a contributor's install and
  # a different dependency tree than CI verified, so drift is a build failure.
  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Fail if package.json and bun.lock disagree
        run: git diff --exit-code -- bun.lock
