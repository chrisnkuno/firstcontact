name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  UV_VERSION: "0.10.12"

jobs:
  # Split from a single `bun run check` so a failure names the stage that broke
  # instead of just "check failed", and so lint and typecheck feedback does not
  # wait behind a full production build.
  static-analysis:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # convex/_generated is committed (Convex's recommended practice) so
      # convex-test and TypeScript can resolve dataModel without a live
      # deployment or CONVEX_DEPLOY_KEY in CI.
      - run: bun run test:coverage
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  api:
    name: FastAPI checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --project services/api
      - run: uv run --project services/api ruff check services/api/app services/api/tests
      - run: uv run --project services/api mypy services/api/app services/api/tests
      - run: uv run --project services/api pytest services/api/tests

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Transitive advisories are forced to fixed releases via package.json
      # overrides (see the //overrides comment there). Fail on high+.
      - name: Audit dependencies for known vulnerabilities
        run: bun audit --audit-level=high

  # The lockfile is the only thing standing between a contributor's install and
  # a different dependency tree than CI verified, so drift is a build failure.
  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Fail if package.json and bun.lock disagree
        run: git diff --exit-code -- bun.lock
