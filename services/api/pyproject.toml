[project]
name = "firstcontact-api"
version = "0.1.0"
description = "FastAPI orchestration backend for FirstContact"
requires-python = ">=3.12,<3.14"
dependencies = [
  "e2b==2.15.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.10.1",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.7",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
